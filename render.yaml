services:
  - type: web
    name: studyflow
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: python manage.py ensure_superuser && gunicorn studyflow.wsgi --workers 2 --timeout 120
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: studyflow-xt1x.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: studyflow-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false          # paste your key in the Render dashboard
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      # --- Superuser auto-creation ---
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: afolabiprosper329@gmail.com
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false          # set a strong password in the Render dashboard

databases:
  - name: studyflow-db
    plan: free
    databaseName: studyflow
    user: studyflow
