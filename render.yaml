services:
  - type: web
    name: studyflow
    runtime: python
    buildCommand: "./build.sh"
    # The build already provisions the admin account; keep each service boot lean.
    startCommand: gunicorn studyflow.wsgi --workers 2 --timeout 120 --preload
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: studyflow-xt1x.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: studyflow-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false          # paste your key in the Render dashboard
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      # --- Password reset email (Gmail App Password; configure in Render Dashboard) ---
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # --- Superuser auto-creation ---
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: afolabiprosper329@gmail.com
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false          # set a strong password in the Render dashboard

databases:
  - name: studyflow-db
    plan: free
    databaseName: studyflow
    user: studyflow
