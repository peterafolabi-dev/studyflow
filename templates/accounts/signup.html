{% extends 'base.html' %}
{% block title %}Sign up · StudyFlow{% endblock %}
{% block content %}
  <div class="auth">
    <h1>Create your account</h1>
    <form method="post" class="form" novalidate>
      {% csrf_token %}
      {% include 'planner/_fields.html' %}
      <button type="submit" class="btn wide">Sign up</button>
    </form>
    <p class="muted">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
  </div>
{% endblock %}
