{% extends 'base.html' %}

{% block title %}Reset link sent · StudyFlow{% endblock %}

{% block content %}
<div class="mx-auto max-w-lg py-10 px-4">
  <div class="rounded-3xl border border-emerald-200 bg-emerald-50 p-8 text-center shadow-xl dark:border-emerald-900/40 dark:bg-emerald-950/20">
    <div class="mb-4 inline-flex h-14 w-14 items-center justify-center rounded-2xl bg-emerald-100 text-2xl dark:bg-emerald-900/50">✉️</div>
    <h1 class="font-display text-2xl font-bold text-slate-900 dark:text-white">Check your email</h1>
    <p class="mt-3 text-sm text-slate-700 dark:text-slate-200">
      If an account exists for that email, a password reset link has been sent. Follow it to choose a new password.
    </p>
    <div class="mt-6 flex justify-center gap-3">
      <a href="{% url 'login' %}" class="rounded-xl bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-700">Back to log in</a>
    </div>
  </div>
</div>
{% endblock %}
