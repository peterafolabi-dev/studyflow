{% extends 'base.html' %}
{% block title %}Log in · StudyFlow{% endblock %}
{% block content %}
  <div class="auth">
    <h1>Log in</h1>
    <form method="post" class="form" novalidate>
      {% csrf_token %}
      {% include 'planner/_fields.html' %}
      <button type="submit" class="btn wide">Log in</button>
    </form>
    <p class="muted">New here? <a href="{% url 'signup' %}">Create an account</a></p>
  </div>
{% endblock %}
