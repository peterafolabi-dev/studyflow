{% extends 'base.html' %}

{% block title %}Password changed · StudyFlow{% endblock %}

{% block content %}
<div class="mx-auto max-w-lg py-10 px-4">
  <div class="rounded-3xl border border-emerald-200 bg-emerald-50 p-8 text-center shadow-xl dark:border-emerald-900/40 dark:bg-emerald-950/20">
    <div class="mb-4 inline-flex h-14 w-14 items-center justify-center rounded-2xl bg-emerald-100 text-2xl dark:bg-emerald-900/50">✅</div>
    <h1 class="font-display text-2xl font-bold text-slate-900 dark:text-white">Password changed</h1>
    <p class="mt-3 text-sm text-slate-700 dark:text-slate-200">Your password has been updated successfully.</p>
    <div class="mt-6 flex justify-center">
      <a href="{% url 'dashboard' %}" class="rounded-xl bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-700">Return to dashboard</a>
    </div>
  </div>
</div>
{% endblock %}
