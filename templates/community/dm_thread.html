{% extends 'base.html' %}
{% block title %}{{ other.username }} · Messages{% endblock %}
{% block content %}
<div class="mx-auto flex max-w-xl flex-col px-4 py-6">
  <div class="flex items-center gap-3">
    <a href="{% url 'dm_inbox' %}" class="text-sm text-slate-500">&larr;</a>
    <a href="{% url 'public_profile' other.username %}" class="font-display text-xl font-bold hover:underline">{{ other.username }}</a>
  </div>
  <div id="dm-list" class="mt-4 flex h-[55vh] flex-col gap-2 overflow-y-auto rounded-2xl border border-slate-200 dark:border-slate-700 p-3">
    {% for m in msgs %}
    <div data-id="{{ m.id }}" class="max-w-[80%] rounded-2xl px-3 py-2 text-sm {% if m.mine %}self-end bg-brand-600 text-white{% else %}self-start bg-slate-100 dark:bg-slate-800{% endif %}"><span class="dm-text"></span><span class="mt-1 block text-[10px] opacity-70">{{ m.when }}</span></div>
    {% endfor %}
  </div>
  <form id="dm-form" class="mt-3 flex gap-2" autocomplete="off">
    <input id="dm-input" maxlength="1000" placeholder="Message {{ other.username }}" class="flex-1 rounded-xl border border-slate-300 dark:border-slate-600 bg-transparent px-3 py-2 text-sm">
    <button class="rounded-xl bg-brand-600 px-4 py-2 text-sm font-semibold text-white">Send</button>
  </form>
  <p id="dm-error" class="mt-2 hidden text-sm text-rose-500"></p>
</div>
{{ msgs|json_script:"dm-initial" }}
<script>
(function () {
  var list = document.getElementById('dm-list'), form = document.getElementById('dm-form'),
      input = document.getElementById('dm-input'), err = document.getElementById('dm-error');
  var last = {{ last_id }}, urlSend = "{% url 'dm_send' other.username %}", urlPoll = "{% url 'dm_poll' other.username %}";
  var csrf = "{{ csrf_token }}";
  function draw(m, node) {
    node = node || document.createElement('div');
    node.dataset.id = m.id;
    node.className = 'max-w-[80%] rounded-2xl px-3 py-2 text-sm ' + (m.mine ? 'self-end bg-brand-600 text-white' : 'self-start bg-slate-100 dark:bg-slate-800');
    node.innerHTML = '<span class="dm-text"></span><span class="mt-1 block text-[10px] opacity-70"></span>';
    node.children[0].textContent = m.text; node.children[1].textContent = m.when;
    return node;
  }
  var initial = JSON.parse(document.getElementById('dm-initial').textContent);
  Array.prototype.forEach.call(list.children, function (n, i) { draw(initial[i], n); });
  function add(m) { if (m.id <= last) return; last = m.id; list.appendChild(draw(m)); list.scrollTop = list.scrollHeight; }
  list.scrollTop = list.scrollHeight;
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = input.value.trim(); if (!text) return;
    err.classList.add('hidden');
    fetch(urlSend, {method: 'POST', headers: {'X-CSRFToken': csrf, 'Content-Type': 'application/x-www-form-urlencoded'},
      body: 'text=' + encodeURIComponent(text), credentials: 'same-origin'})
      .then(function (r) { return r.json().then(function (j) { return [r.ok, j]; }); })
      .then(function (res) {
        if (res[0]) { input.value = ''; add(res[1].message); }
        else { err.textContent = res[1].error || 'Could not send.'; err.classList.remove('hidden'); }
      });
  });
  setInterval(function () {
    if (document.hidden) return;
    fetch(urlPoll + '?after=' + last, {credentials: 'same-origin'}).then(function (r) { return r.json(); })
      .then(function (j) { j.messages.forEach(add); }).catch(function () {});
  }, 4000);
})();
</script>
{% endblock %}
