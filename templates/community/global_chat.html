{% extends 'base.html' %}
{% block title %}Campus Chat · StudyFlow{% endblock %}
{% block content %}
<div class="mb-6 fade-in-up">
  <h1 class="font-display text-4xl font-bold tracking-tight text-slate-900 dark:text-white mb-2">StudyFlow Chat <span class="animate-pulse inline-block">💬</span></h1>
  <p class="text-slate-500 dark:text-slate-400 mt-1">Connect with students worldwide or locally at your campus.</p>
</div>

<div class="bg-white/40 dark:bg-slate-900/40 backdrop-blur-3xl border border-white/60 dark:border-slate-700/50 rounded-3xl shadow-2xl overflow-hidden flex flex-col md:flex-row fade-in-up h-[75vh] min-h-[600px] relative">
    
    <!-- Sidebar / Room Switcher -->
    <div class="w-full md:w-72 bg-white/50 dark:bg-slate-950/50 backdrop-blur-md border-b md:border-b-0 md:border-r border-slate-200/50 dark:border-slate-800/50 p-5 flex flex-col gap-3 z-10">
        <h3 class="font-bold text-xs uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2 px-2 flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z"></path></svg>
            Chat Rooms
        </h3>
        
        <button onclick="switchRoom('global')" id="btn-global" class="room-btn group relative w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl bg-gradient-to-r from-brand-500 to-brand-600 text-white font-semibold transition-all shadow-lg shadow-brand-500/30 text-left overflow-hidden">
            <div class="absolute inset-0 bg-white/20 translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-700"></div>
            <span class="text-2xl relative z-10 drop-shadow-md">🌍</span> 
            <span class="relative z-10">Global Network</span>
            <span class="absolute right-4 w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        </button>
        
        <button onclick="switchRoom('futminna')" id="btn-futminna" class="room-btn group relative w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl hover:bg-white/60 dark:hover:bg-slate-800/60 text-slate-700 dark:text-slate-300 font-medium transition-all text-left border border-transparent hover:border-slate-200 dark:hover:border-slate-700">
            <span class="text-2xl group-hover:scale-110 transition-transform">🏫</span> 
            <span>FUT Minna</span>
        </button>
        
        <!-- Animated decorative element -->
        <div class="mt-auto hidden md:block">
            <div class="p-4 rounded-2xl bg-gradient-to-br from-brand-100/50 to-purple-100/50 dark:from-brand-900/20 dark:to-purple-900/20 border border-brand-200/50 dark:border-brand-800/30 text-center">
                <div class="text-3xl mb-2 animate-bounce">🚀</div>
                <p class="text-xs text-brand-800 dark:text-brand-300 font-medium">Keep it friendly and helpful!</p>
            </div>
        </div>
    </div>

    <!-- Main Chat Area -->
    <div class="flex-1 flex flex-col relative bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] dark:bg-[url('https://www.transparenttextures.com/patterns/stardust.png')] bg-fixed">
        
        <!-- Glass Header -->
        <div class="absolute top-0 left-0 right-0 z-20 bg-white/70 dark:bg-slate-950/70 backdrop-blur-xl px-6 py-4 border-b border-slate-200/50 dark:border-slate-800/50 flex justify-between items-center shadow-sm">
            <div class="flex items-center gap-3">
                <div class="relative flex h-3.5 w-3.5">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3.5 w-3.5 bg-emerald-500 border-2 border-white dark:border-slate-900"></span>
                </div>
                <h2 id="room-title" class="font-bold text-slate-800 dark:text-white font-display text-lg tracking-wide">🌍 Global Network</h2>
            </div>
            <span class="text-emerald-700 dark:text-emerald-300 text-xs font-bold uppercase tracking-wider bg-emerald-100/80 dark:bg-emerald-900/40 border border-emerald-200 dark:border-emerald-800 px-3 py-1 rounded-full flex items-center gap-1.5">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                Live
            </span>
        </div>

        <!-- Messages Area -->
        <div id="chat-messages" class="flex-1 p-6 pt-24 overflow-y-auto flex flex-col gap-5 pb-28 scroll-smooth">
            <!-- JS will populate -->
            <div class="flex justify-center items-center h-full">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-brand-600"></div>
            </div>
        </div>

        <!-- Floating Input Area -->
        <div class="absolute bottom-6 left-6 right-6 z-20">
            <div class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-2xl border border-white/50 dark:border-slate-700/50 rounded-3xl p-2 shadow-2xl shadow-brand-500/10">
                <form id="chat-form" class="flex gap-2 items-center">
                    {% csrf_token %}
                    <button type="button" class="p-3 text-slate-400 hover:text-brand-500 transition-colors shrink-0">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </button>
                    <input type="text" id="chat-input" class="flex-1 bg-transparent border-none px-2 py-3 text-sm text-slate-900 dark:text-white focus:ring-0 placeholder-slate-400 dark:placeholder-slate-500" placeholder="Type your message..." autocomplete="off">
                    <button type="submit" class="bg-gradient-to-r from-brand-600 to-purple-600 hover:from-brand-500 hover:to-purple-500 text-white p-3.5 rounded-2xl transition-transform hover:scale-105 shadow-lg shadow-brand-500/25 shrink-0 flex items-center justify-center">
                        <svg class="w-5 h-5 translate-x-[1px] translate-y-[-1px]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    const chatMessages = document.getElementById('chat-messages');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const roomTitle = document.getElementById('room-title');
    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
    
    let currentRoom = 'global';
    let isScrolledToBottom = true;

    function switchRoom(room) {
        currentRoom = room;
        
        // Reset styles
        document.querySelectorAll('.room-btn').forEach(btn => {
            btn.className = 'room-btn group relative w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl hover:bg-white/60 dark:hover:bg-slate-800/60 text-slate-700 dark:text-slate-300 font-medium transition-all text-left border border-transparent hover:border-slate-200 dark:hover:border-slate-700';
            btn.querySelector('.text-2xl').classList.remove('relative', 'z-10', 'drop-shadow-md');
            if(btn.querySelector('.absolute.right-4')) btn.querySelector('.absolute.right-4').remove();
            if(btn.querySelector('.absolute.inset-0')) btn.querySelector('.absolute.inset-0').remove();
        });
        
        // Active styles
        const activeBtn = document.getElementById('btn-' + room);
        activeBtn.className = 'room-btn group relative w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl bg-gradient-to-r from-brand-500 to-brand-600 text-white font-semibold transition-all shadow-lg shadow-brand-500/30 text-left overflow-hidden';
        activeBtn.querySelector('.text-2xl').classList.add('relative', 'z-10', 'drop-shadow-md');
        activeBtn.insertAdjacentHTML('afterbegin', '<div class="absolute inset-0 bg-white/20 translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-700"></div>');
        activeBtn.insertAdjacentHTML('beforeend', '<span class="absolute right-4 w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>');
        
        // Update Title
        roomTitle.innerHTML = room === 'global' ? '🌍 Global Network' : '🏫 FUT Minna';
        
        chatMessages.innerHTML = `
            <div class="flex justify-center items-center h-full">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-brand-600"></div>
            </div>`;
        fetchMessages();
    }

    chatMessages.addEventListener('scroll', () => {
        isScrolledToBottom = chatMessages.scrollHeight - chatMessages.clientHeight <= chatMessages.scrollTop + 30;
    });

    async function fetchMessages() {
        try {
            const res = await fetch(`{% url 'chat_api' %}?room=${currentRoom}`);
            const data = await res.json();
            
            chatMessages.innerHTML = data.messages.map(msg => `
                <div class="flex flex-col max-w-[85%] sm:max-w-[75%] ${msg.is_me ? 'self-end items-end' : 'self-start items-start'} animate-in slide-in-from-bottom-2 fade-in duration-300">
                    <span class="text-[10px] font-bold tracking-wide uppercase text-slate-400 dark:text-slate-500 mb-1.5 px-2">${msg.is_me ? 'You' : msg.username} <span class="mx-1 opacity-50">•</span> ${msg.time}</span>
                    <div class="${msg.is_me 
                        ? 'bg-gradient-to-br from-brand-500 to-brand-600 text-white rounded-2xl rounded-tr-sm shadow-md shadow-brand-500/20' 
                        : 'bg-white/90 dark:bg-slate-800/90 backdrop-blur-md border border-white/50 dark:border-slate-700/50 text-slate-800 dark:text-slate-100 rounded-2xl rounded-tl-sm shadow-sm'} 
                        px-4 py-3 text-sm leading-relaxed">
                        ${msg.text}
                    </div>
                </div>
            `).join('');

            if(isScrolledToBottom) {
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        } catch (e) { console.error(e); }
    }

    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = chatInput.value.trim();
        if(!text) return;
        
        const now = new Date();
        const timeString = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        
        // Optimistic UI
        chatMessages.innerHTML += `
            <div class="flex flex-col max-w-[85%] sm:max-w-[75%] self-end items-end opacity-70 transition-opacity animate-in zoom-in-95 duration-200" id="temp-msg">
                <span class="text-[10px] font-bold tracking-wide uppercase text-slate-400 dark:text-slate-500 mb-1.5 px-2">You <span class="mx-1 opacity-50">•</span> ${timeString}</span>
                <div class="bg-gradient-to-br from-brand-500 to-brand-600 text-white rounded-2xl rounded-tr-sm shadow-md shadow-brand-500/20 px-4 py-3 text-sm leading-relaxed">
                    ${text}
                </div>
            </div>
        `;
        chatMessages.scrollTop = chatMessages.scrollHeight;
        chatInput.value = '';
        
        try {
            await fetch("{% url 'chat_api' %}", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                body: JSON.stringify({ text: text, room: currentRoom })
            });
            isScrolledToBottom = true;
            fetchMessages(); 
        } catch (e) { console.error(e); }
    });

    fetchMessages();
    setInterval(fetchMessages, 3000);
</script>
{% endblock %}
