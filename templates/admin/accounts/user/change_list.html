{% extends "admin/change_list.html" %}

{% block object-tools %}
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin: 0 0 20px;">
    <div style="background: #fff; border: 1px solid #dfe3e8; border-radius: 8px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.04);">
      <div style="font-size: 11px; color: #6c757d; text-transform: uppercase; letter-spacing: 0.08em;">Active today</div>
      <div style="font-size: 32px; font-weight: 700; color: #1f2937; margin-top: 6px;">{{ active_users_today }}</div>
    </div>
    <div style="background: #fff; border: 1px solid #dfe3e8; border-radius: 8px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.04);">
      <div style="font-size: 11px; color: #6c757d; text-transform: uppercase; letter-spacing: 0.08em;">Last 7 days</div>
      <div style="font-size: 32px; font-weight: 700; color: #1f2937; margin-top: 6px;">{{ active_users_7d }}</div>
    </div>
    <div style="background: #fff; border: 1px solid #dfe3e8; border-radius: 8px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.04);">
      <div style="font-size: 11px; color: #6c757d; text-transform: uppercase; letter-spacing: 0.08em;">Last 30 days</div>
      <div style="font-size: 32px; font-weight: 700; color: #1f2937; margin-top: 6px;">{{ active_users_30d }}</div>
    </div>
    <div style="background: #fff; border: 1px solid #dfe3e8; border-radius: 8px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.04);">
      <div style="font-size: 11px; color: #6c757d; text-transform: uppercase; letter-spacing: 0.08em;">Total active users</div>
      <div style="font-size: 32px; font-weight: 700; color: #1f2937; margin-top: 6px;">{{ total_users }}</div>
    </div>
  </div>
  {{ block.super }}
{% endblock %}
