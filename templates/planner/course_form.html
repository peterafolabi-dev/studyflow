{% extends 'base.html' %}
{% block title %}{{ heading }} · StudyFlow{% endblock %}
{% block content %}
  <h1>{{ heading }}</h1>
  <form method="post" class="form" novalidate>
    {% csrf_token %}
    {% include 'planner/_fields.html' %}
    <div class="form-actions">
      <button type="submit" class="btn">Save course</button>
      <a class="btn ghost" href="{% if course %}{% url 'course_detail' course.pk %}{% else %}{% url 'course_list' %}{% endif %}">Cancel</a>
    </div>
  </form>
{% endblock %}
