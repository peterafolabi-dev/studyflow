{% extends 'base.html' %}
{% block title %}{{ heading }} · StudyFlow{% endblock %}
{% block content %}
  <p class="crumb"><a href="{% url 'course_detail' course.pk %}">{{ course.name }}</a></p>
  <h1>{{ heading }}</h1>
  <form method="post" class="form" novalidate>
    {% csrf_token %}
    {% include 'planner/_fields.html' %}
    <div class="form-actions">
      <button type="submit" class="btn">Save task</button>
      <a class="btn ghost" href="{% url 'course_detail' course.pk %}">Cancel</a>
    </div>
  </form>
{% endblock %}
