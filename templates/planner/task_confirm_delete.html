{% extends 'base.html' %}
{% block title %}Delete task · StudyFlow{% endblock %}
{% block content %}
  <h1>Delete "{{ task.title }}"?</h1>
  <p>You can't undo this.</p>
  <form method="post" class="form-actions">
    {% csrf_token %}
    <button type="submit" class="btn danger-solid">Delete task</button>
    <a class="btn ghost" href="{% url 'course_detail' task.course.pk %}">Cancel</a>
  </form>
{% endblock %}
